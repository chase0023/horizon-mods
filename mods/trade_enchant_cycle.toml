changelog = """First release.

- Reroll a villager's offers with sneak + right-click: used and sold-out trades, profession, level, XP and demand are kept.
- Reroll an enchanting table's three offers with the `Reroll [R]` bar or **R**: no lapis, no XP and no item spent, and the game's own offer generator behind it.
- The bar is a footer on both panels, placed from the panel's rectangle, so it follows every GUI scale and never covers slots.
- Tooltips stay on top: one that reaches the bar is drawn again over it.
- No cooldown; a held key rerolls once.
- Pinned to Horizon 9f42064 (the newest Nightly, published 2026-11-13): applied and compiled there without warnings."""
