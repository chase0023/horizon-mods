name = "Trade & Enchant Cycle"
summary = "Reroll villager trades and enchanting offers with R — free, no lapis or XP, nothing reset."
description = """Two quality-of-life features for trading and enchanting, as a native Horizon mod: a Rust source bundle, no jar and no Java.

**Villager trade cycling** — sneak + right-click a villager to reroll its offers. Every offer comes from the game's own data-driven trade sets for that profession, level and villager type, so prices, demand, max uses and enchanted books behave exactly as vanilla. Used and sold-out trades (`uses > 0`) are kept as they are, and profession, level, XP, restock counters and demand are untouched. The click is claimed, so the trade screen does not open under it; a plain right-click still trades.

**Enchanting offer cycling** — reroll the three offers with the `Reroll [R]` bar under the panel, or with **R**. The offers come from the game's own `enchant_offers` with the next seed from the world's random, so they are what vanilla would have generated. Nothing is spent: no lapis, no levels, no item damage, no enchantment applied, nothing auto-selected. A real click afterwards applies exactly the offer it promised. Only an unenchanted, enchantable item gets offers, which is vanilla's own rule.

**In both screens** the same vanilla-styled `Reroll [R]` bar sits on the panel's bottom edge, where vanilla draws nothing, and **R** does the same thing as clicking it. The bar is placed from the panel's own origin and size, so it follows every GUI scale and window size. There is no cooldown, and a held key rerolls once. Item tooltips are never hidden: if one reaches the bar, it is drawn on top of it, as vanilla draws tooltips.

**What it does not do.** It does not change vanilla's layout, textures or GUI, does not add a custom screen, and does not alter the network protocol. Both features are decided on the server side (single player and LAN host): a request names no target, so it can only reach the player's own open screen, and the server re-checks the channel, the config and the player's own menu before rerolling. On someone else's server the mod does nothing and desynchronises nothing. Nothing is read from or written to the network beyond Horizon's own mod-message channel.

**Settings** (Options > Mods > Trade & Enchant Cycle) switch each feature on or off, choose the activation (bar only, or `R` too) and the feedback message style; the same settings live in `config/trade-enchant-cycle.json`.

**Compatibility.** The bundle pins Horizon `9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0` (the newest Nightly, published 2026-11-13, Minecraft 26.3) and horizon-mixins `0d6b103c70633d8fd9443d8d0acd3aadaacedb06`, because it reads game internals the stable hook surface does not expose (a villager's trade list, a guest's enchanting menu). It needs `NATIVE_HOOKS_API` 80 or later, so it builds on the Nightlies after that one too. It was applied and compiled on the newest Nightly with the registry's own `native/tools/native.py` (no warnings) and exercised feature by feature in a real world on `nightly-2026-11-01-c9d474d`.

**Source.** `https://github.com/chase0023/trade-enchant-cycle` (MIT): the bundle in `mixins/trade_enchant_cycle/`, the same pure code compiled by `cargo test`, the game-side tests, the build scripts and a README with the hooks used and the known limitations. The `.hnmod` is the source: 18 payload files, a manifest with 6 modules and 11 injections, and this licence. The file in this entry was made from that source with `native/tools/native.py package`."""
authors = ["chase0023"]
license = "MIT"
source = "https://github.com/chase0023/trade-enchant-cycle"

